name: Windows build and workflow tests
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Repository QA and WPF core tests
        shell: pwsh
        run: ./scripts/qa.ps1
